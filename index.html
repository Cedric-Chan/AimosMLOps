<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aimos Platform</title>
  <link rel="stylesheet" href="assets/shell.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <button id="sidebar-toggle" class="sidebar-toggle" aria-label="收起导航" title="收起导航">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">Aimos Platform</span>
      </div>
      <nav id="nav"><!-- rendered by shell.js --></nav>
      <div class="sidebar-footer">
        <a id="arch-link" href="#feature-store/architecture">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          <span>Architecture</span>
        </a>
        <span class="footer-note">Aimos MLOps · 交互 Demo</span>
      </div>
    </aside>
    <main id="content">
      <div id="content-body"><!-- placeholder pages or prototype iframe rendered here --></div>
      <button id="open-standalone" class="open-standalone" title="在新窗口打开原型（用于元素选取）" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </button>
    </main>
  </div>
  <script src="assets/shell.js"></script>
</body>
</html>
