openapi: 3.1.0
info:
  title: Transformation API
  version: 1.0.0-mvp
  description: |
    Transformation 的 CRUD、Version 管理、Test、Manage 操作。
    与架构说明 §4.2、《产品原型图》§3.2 对齐。

servers:
  - url: /api/v1

paths:
  /transformations:
    get:
      operationId: listTransformations
      summary: 按条件分页查询 Transformation
      parameters:
        - name: name
          in: query
          schema: { type: string }
          description: 对 Transformation 名称模糊匹配
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/TransformationType" }
        - name: language
          in: query
          schema: { $ref: "#/components/schemas/ScriptLanguage" }
        - name: region
          in: query
          schema: { type: string }
        - name: creator
          in: query
          schema: { type: string }
        - name: ownedByMe
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: 分页列表，同名校内 rowspan 合并
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TransformationVersion" }

    post:
      operationId: createTransformation
      summary: 新建 Transformation（首个 Version）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransformationCreate" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransformationVersion" }
        "400":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /transformations/{tfName}:
    parameters:
      - name: tfName
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getTransformation
      summary: 获取某 Transformation 的全部 Version
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  versions:
                    type: array
                    items: { $ref: "#/components/schemas/TransformationVersion" }

  /transformations/{tfName}/versions:
    parameters:
      - name: tfName
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: addTransformationVersion
      summary: 新增 Version（可选从已有 Version 复制）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransformationVersionCreate" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransformationVersion" }

  /transformations/{tfName}/versions/{version}:
    parameters:
      - name: tfName
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getTransformationVersion
      summary: 获取指定 Version 详情
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransformationVersion" }
    put:
      operationId: updateTransformationVersion
      summary: 更新 Version（仅 DRAFT 状态可改）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransformationVersionUpdate" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransformationVersion" }
        "409":
          description: 非 DRAFT 状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /transformations/{tfName}/versions/{version}/manage:
    parameters:
      - name: tfName
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: manageTransformationVersion
      summary: 状态流转（Enable / Disable / Draft / Delete）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [enable, disable, draft, delete]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransformationVersion" }
        "409":
          description: 非法状态流转
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /transformations/{tfName}/versions/{version}/test:
    parameters:
      - name: tfName
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: testTransformation
      summary: 对指定 Version 执行 Test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [region, inputParams]
              properties:
                region: { type: string }
                inputParams:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success, failed] }
                  outputParams:
                    type: object
                    additionalProperties: true
                  durationMs: { type: integer }
                  errorMessage: { type: string }

  /transformations/{tfName}/versions/{version}/test/history:
    parameters:
      - name: tfName
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: listTransformationTestHistory
      summary: 查询该 Version 的 Test 历史
      parameters:
        - name: region
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [success, failed] }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TestHistoryEntry" }

components:
  schemas:
    TransformationType:
      type: string
      enum: [Scalar, Aggregator]
      description: |
        ScalarFunction（Map -> Map）或 AggregateFunction（List<Map> -> Map）。

    ScriptLanguage:
      type: string
      enum: [groovy, python]

    TransformationStatus:
      type: string
      enum: [DRAFT, ENABLED, DISABLED, PENDING]

    TransformationVersion:
      type: object
      properties:
        name: { type: string }
        version: { type: integer }
        type: { $ref: "#/components/schemas/TransformationType" }
        language: { $ref: "#/components/schemas/ScriptLanguage" }
        status: { $ref: "#/components/schemas/TransformationStatus" }
        regions:
          type: array
          items: { type: string }
        script: { type: string }
        inputParams:
          type: array
          items: { $ref: "#/components/schemas/ParamDef" }
        outputParams:
          type: array
          items: { $ref: "#/components/schemas/ParamDef" }
        owner: { type: string }
        creator: { type: string }
        description: { type: string }
        createTime: { type: string, format: date-time }

    TransformationCreate:
      type: object
      required: [name, type, language, regions, script, outputParams]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/TransformationType" }
        language: { $ref: "#/components/schemas/ScriptLanguage" }
        regions:
          type: array
          items: { type: string }
        script: { type: string }
        inputParams:
          type: array
          items: { $ref: "#/components/schemas/ParamDef" }
        outputParams:
          type: array
          items: { $ref: "#/components/schemas/ParamDef" }
        owner: { type: string }
        description: { type: string }

    TransformationVersionCreate:
      type: object
      properties:
        copyFromVersion:
          type: integer
          description: 若设置则从指定 Version 复制配置
        type: { $ref: "#/components/schemas/TransformationType" }
        language: { $ref: "#/components/schemas/ScriptLanguage" }
        regions:
          type: array
          items: { type: string }
        script: { type: string }
        inputParams:
          type: array
          items: { $ref: "#/components/schemas/ParamDef" }
        outputParams:
          type: array
          items: { $ref: "#/components/schemas/ParamDef" }
        owner: { type: string }
        description: { type: string }

    TransformationVersionUpdate:
      type: object
      properties:
        type: { $ref: "#/components/schemas/TransformationType" }
        language: { $ref: "#/components/schemas/ScriptLanguage" }
        regions:
          type: array
          items: { type: string }
        script: { type: string }
        inputParams:
          type: array
          items: { $ref: "#/components/schemas/ParamDef" }
        outputParams:
          type: array
          items: { $ref: "#/components/schemas/ParamDef" }
        owner: { type: string }
        description: { type: string }

    ParamDef:
      type: object
      required: [name, dataType]
      properties:
        name: { type: string }
        dataType: { type: string }

    TestHistoryEntry:
      type: object
      properties:
        id: { type: string }
        region: { type: string }
        createTime: { type: string, format: date-time }
        operator: { type: string }
        status: { type: string, enum: [success, failed] }
        inputParams: { type: object, additionalProperties: true }
        outputParams: { type: object, additionalProperties: true }
        durationMs: { type: integer }

    ErrorResponse:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object }
