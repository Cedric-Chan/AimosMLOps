<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alert Group · Aimos Console</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="page">

    <!-- 筛选栏 -->
    <div class="card filter-bar">
      <div class="filter-item">
        <label>Name：</label>
        <input id="f-name" type="text" placeholder="Please enter">
      </div>
      <div class="filter-actions">
        <button class="btn btn-default" id="btn-reset">Reset</button>
        <button class="btn btn-primary" id="btn-query">Query</button>
      </div>
    </div>

    <!-- 列表卡片 -->
    <div class="card">
      <div class="list-header">
        <span class="list-title">Alert Group List</span>
        <button class="btn btn-primary" id="btn-add">Add Group</button>
        <div class="toolbar-icons">
          <button class="icon-btn" id="btn-refresh" title="Refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
          </button>
          <button class="icon-btn" id="btn-info" title="说明">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          </button>
          <button class="icon-btn" id="btn-settings" title="预留">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </div>

      <table class="ag-table">
        <thead>
          <tr>
            <th style="width:8%">Group Id</th>
            <th style="width:15%">Name</th>
            <th style="width:10%">Type</th>
            <th style="width:42%">Webhook</th>
            <th style="width:16%">Update Time</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>

      <div class="pagination">
        <span id="page-total" class="page-total"></span>
        <div id="page-buttons" class="page-buttons"></div>
        <select id="page-size">
          <option value="10" selected>10 / page</option>
          <option value="20">20 / page</option>
          <option value="50">50 / page</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Add / Edit Alert Group 弹窗 -->
  <div id="ag-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title">
        <span id="ag-modal-title">Edit Alert Group</span>
        <button class="modal-close" id="btn-ag-modal-close">×</button>
      </div>
      <div class="form-item">
        <label><i>*</i>Name <span class="help" data-tip="Alert Group 名称，告警发送时用于标识接收组">?</span>：</label>
        <div class="input-wrap">
          <input id="m-name" type="text" placeholder="Please Input Name">
          <button class="input-clear" data-for="m-name" title="Clear">⊗</button>
        </div>
        <div class="form-err hidden" id="err-name"></div>
      </div>
      <div class="form-item">
        <label><i>*</i>Type：</label>
        <select id="m-type"><option value="">Please Select</option></select>
        <div class="form-err hidden" id="err-type"></div>
      </div>
      <div class="form-item">
        <label><i>*</i>Webhook：</label>
        <div class="input-wrap">
          <input id="m-webhook" type="text" placeholder="https://openapi.seatalk.io/webhook/group/...">
          <button class="input-clear" data-for="m-webhook" title="Clear">⊗</button>
        </div>
        <div class="form-err hidden" id="err-webhook"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" id="btn-ag-cancel">Cancel</button>
        <button class="btn btn-primary" id="btn-ag-ok">OK</button>
      </div>
    </div>
  </div>

  <!-- 删除确认 -->
  <div id="confirm-modal" class="modal-overlay hidden">
    <div class="modal modal-confirm">
      <div class="confirm-text" id="confirm-text"></div>
      <div class="modal-footer">
        <button class="btn btn-default" id="btn-confirm-cancel">Cancel</button>
        <button class="btn btn-primary" id="btn-confirm-ok">OK</button>
      </div>
    </div>
  </div>

  <!-- Verify 发送成功动效 -->
  <div id="verify-success" class="verify-toast hidden">
    <span class="check-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </span>
    <span class="verify-text">
      <strong>Test message sent</strong>
      <em id="verify-detail"></em>
    </span>
  </div>

  <div id="toast-container"></div>
  <script src="app.js"></script>
</body>
</html>
