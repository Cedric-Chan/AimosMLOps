<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Mgmt · Aimos</title>
  <link rel="stylesheet" href="app.css?v=20260909a">
</head>
<body>

  <!-- ══════════ 列表页 ══════════ -->
  <div id="page-list">
    <div class="page">

      <div class="card filter-card">
        <div class="filter-grid">
          <div class="filter-item"><label>Name：</label><input id="f-name" type="text" placeholder="Please enter"></div>
          <div class="filter-item"><label>Model Name：</label><input id="f-model" type="text" placeholder="Please enter"></div>
          <div class="filter-item"><label>Model Type：</label>
            <select id="f-type"><option value="">Please select</option><option>Chat</option><option>Embedding</option></select>
          </div>
          <div class="filter-item"><label>Region：</label><input id="f-region" type="text" placeholder="Please enter"></div>
          <div class="filter-item" data-extra hidden><label>Provider：</label>
            <select id="f-provider"><option value="">Please select</option></select>
          </div>
          <div class="filter-item" data-extra hidden><label>Team Access：</label>
            <select id="f-access"><option value="">Please select</option><option>Private</option></select>
          </div>
          <div class="filter-actions">
            <button class="btn btn-default" id="btn-reset">Reset</button>
            <button class="btn btn-primary" id="btn-query">Query</button>
            <button class="link-btn collapse-toggle" id="btn-collapse">Collapse ∧</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="list-header">
          <span class="list-title">LLM Management</span>
          <button class="btn btn-primary" id="btn-add">Create</button>
          <div class="toolbar-icons">
            <button class="icon-btn" id="btn-refresh" title="Refresh" aria-label="Refresh">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
            </button>
            <button class="icon-btn" id="btn-info" title="LLM 资产说明" aria-label="LLM 资产说明">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            </button>
            <button class="icon-btn" id="btn-settings" title="预留" aria-label="列设置（预留）">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
          </div>
        </div>

        <div class="table-scroll">
          <table class="llm-table">
            <thead>
              <tr>
                <th>Name</th><th>Model Name</th><th>Provider</th><th>Model Type</th>
                <th>Owner</th><th>Team Access</th><th>Region</th><th>Endpoint</th>
                <th>Description</th><th>Create Time</th><th>Update Time</th><th>Action</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>

        <div class="pagination">
          <span id="page-total" class="page-total"></span>
          <div id="page-buttons" class="page-buttons"></div>
          <select id="page-size">
            <option value="10" selected>10 / page</option>
            <option value="20">20 / page</option>
            <option value="50">50 / page</option>
          </select>
          <span class="goto-page">Go to <input id="goto-input" type="number" min="1" placeholder=""> Page</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ══════════ Create / Edit LLM Model 弹窗 ══════════ -->
  <div id="llm-modal" class="modal-overlay hidden">
    <div class="modal modal-wide">
      <div class="modal-title">
        <span id="llm-modal-title">Create LLM Model</span>
        <button class="modal-close" id="btn-llm-close" aria-label="Close">×</button>
      </div>
      <div class="form-item">
        <label><i>*</i>Name：</label>
        <input id="m-name" type="text" placeholder="Please enter">
        <div class="form-err hidden" id="err-name"></div>
      </div>
      <div class="form-item">
        <label><i>*</i>Region：</label>
        <select id="m-region"><option value="">Please select</option></select>
        <div class="form-err hidden" id="err-region"></div>
      </div>
      <div class="form-item">
        <label><i>*</i>Provider：</label>
        <select id="m-provider"><option value="">Please select</option></select>
        <div class="form-err hidden" id="err-provider"></div>
      </div>
      <div class="form-item">
        <label><i>*</i>Model Type：</label>
        <select id="m-type"><option value="">Please select</option><option>Chat</option><option>Embedding</option></select>
        <div class="form-err hidden" id="err-type"></div>
      </div>
      <div class="form-item">
        <label><i>*</i>Model Name：</label>
        <input id="m-model" type="text" placeholder="e.g. Monee/Qwen3-VL-8B-Instruct">
        <div class="form-err hidden" id="err-model"></div>
      </div>
      <div class="form-item">
        <label><i>*</i>API Key：</label>
        <input id="m-apikey" type="text" placeholder="Please enter">
        <div class="form-err hidden" id="err-apikey"></div>
      </div>
      <div class="form-item">
        <label><i>*</i>Endpoint：</label>
        <input id="m-endpoint" type="text" placeholder="Please enter">
        <div class="form-err hidden" id="err-endpoint"></div>
      </div>
      <div class="form-item">
        <label>Need Proxy：</label>
        <button type="button" id="m-proxy" class="switch on" aria-label="Need Proxy" aria-pressed="true"></button>
      </div>
      <div class="form-item">
        <label><i>*</i>Owner：</label>
        <div class="owner-box" id="owner-box">
          <span id="owner-chips" class="owner-chips"></span>
          <input id="m-owner-input" type="text" placeholder="type email, Enter to add">
        </div>
        <div class="form-err hidden" id="err-owner"></div>
      </div>
      <div class="form-item">
        <label><span class="form-label-with-help">Team Access <span class="help" data-tip="Team Access 决定哪些 Biz Team 可以使用该模型">?</span></span>：</label>
        <select id="m-access"><option value="">None (Private)</option></select>
        <div class="field-hint">None means this model is private and only available to its owners.</div>
      </div>
      <div class="form-item">
        <label>Description：</label>
        <textarea id="m-desc" rows="3" placeholder="Please enter"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" id="btn-llm-cancel">Cancel</button>
        <button class="btn btn-default" id="btn-llm-check" disabled>Check</button>
        <button class="btn btn-primary" id="btn-llm-submit" disabled>Submit</button>
      </div>
    </div>
  </div>

  <div id="toast-container" aria-live="polite"></div>
  <script src="app.js?v=20260909a"></script>
</body>
</html>
