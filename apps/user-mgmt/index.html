<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User · Aimos Console</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="page">

    <!-- 筛选栏 -->
    <div class="card filter-bar">
      <div class="filter-item">
        <label>Email：</label>
        <input id="f-email" type="text" placeholder="Please enter">
      </div>
      <div class="filter-item">
        <label>Biz Team：</label>
        <select id="f-team"><option value="">Please select</option></select>
      </div>
      <div class="filter-item">
        <label>Role：</label>
        <select id="f-role">
          <option value="">Please select</option>
          <option>VIEWER</option>
          <option>EDITOR</option>
          <option>ADMIN</option>
        </select>
      </div>
      <div class="filter-actions">
        <button class="btn btn-default" id="btn-reset">Reset</button>
        <button class="btn btn-primary" id="btn-query">Query</button>
      </div>
    </div>

    <!-- 工具栏 + 表格 -->
    <div class="card">
      <div class="toolbar">
        <button class="btn btn-primary" id="btn-add">Add User</button>
        <button class="btn btn-primary" id="btn-team-dir">Team Dir</button>
        <div class="toolbar-icons">
          <button class="icon-btn" id="btn-refresh" title="Refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
          </button>
          <button class="icon-btn" id="btn-info" title="聚合规则说明">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          </button>
          <button class="icon-btn" id="btn-settings" title="预留">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>

        <!-- Team Dir 浮窗 -->
        <div id="team-dir-panel" class="team-dir-panel hidden">
          <div id="team-tags" class="team-tags"></div>
          <div class="team-dir-footer">
            <button class="btn btn-default" id="btn-team-close">Close</button>
          </div>
        </div>
      </div>

      <table class="user-table">
        <thead>
          <tr>
            <th style="width:32%">Email</th>
            <th style="width:17%">Biz Team</th>
            <th style="width:12%">Role</th>
            <th style="width:26%">Updated Time</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>

      <div class="pagination">
        <span id="page-total" class="page-total"></span>
        <div id="page-buttons" class="page-buttons"></div>
        <select id="page-size">
          <option value="10" selected>10 / page</option>
          <option value="20">20 / page</option>
          <option value="50">50 / page</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Add / Edit User 弹窗 -->
  <div id="user-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title">
        <span id="user-modal-title">Add User</span>
        <button class="modal-close" id="btn-user-modal-close">×</button>
      </div>
      <div class="form-item">
        <label><i>*</i>Email</label>
        <input id="m-email" type="text" placeholder="Please Input Email">
        <div class="form-err hidden" id="err-email"></div>
      </div>
      <div class="form-item">
        <label><i>*</i>Biz Team</label>
        <select id="m-team"><option value="">请选择Biz Team</option></select>
        <div class="form-err hidden" id="err-team"></div>
      </div>
      <div class="form-item">
        <label><i>*</i>Role</label>
        <select id="m-role">
          <option value="">请选择角色</option>
          <option>VIEWER</option>
          <option>EDITOR</option>
          <option>ADMIN</option>
        </select>
        <div class="form-err hidden" id="err-role"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" id="btn-user-cancel">Cancel</button>
        <button class="btn btn-primary" id="btn-user-ok">OK</button>
      </div>
    </div>
  </div>

  <!-- 通用确认弹窗 -->
  <div id="confirm-modal" class="modal-overlay hidden">
    <div class="modal modal-confirm">
      <div class="confirm-text" id="confirm-text"></div>
      <div class="modal-footer">
        <button class="btn btn-default" id="btn-confirm-cancel">Cancel</button>
        <button class="btn btn-primary" id="btn-confirm-ok">OK</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="app.js"></script>
</body>
</html>
